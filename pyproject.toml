[project]
name = "wellmanifest-apx"
version = "0.1.0"
description = "Wellmanifest standard for Autonomous Application Packs (APX)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
apx-check = "src.apx_check:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
